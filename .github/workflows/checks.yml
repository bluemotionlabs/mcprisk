name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: checks/package-lock.json
      - run: npm ci
      # vitest does not typecheck, so a sync that breaks tsc can pass every test
      - run: npm run typecheck
      - run: npm test
